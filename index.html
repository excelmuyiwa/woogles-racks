<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Woogles Racks</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: black;
    color: white;
    text-align: center;
}

.player {
    margin: 40px;
}

.name {
    font-size: 36px;
    font-weight: bold;
}

.rack {
    font-size: 64px;
    letter-spacing: 10px;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="player">
    <div class="name">Player A</div>
    <div id="playerA" class="rack">Loading...</div>
</div>

<div class="player">
    <div class="name">Player B</div>
    <div id="playerB" class="rack">Loading...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBnGbM2XT7ryHhfXqjJ2G5XyTJRpP0kYR0",
    authDomain: "woogles-racks.firebaseapp.com",
    databaseURL: "https://woogles-racks-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "woogles-racks",
    storageBucket: "woogles-racks.firebasestorage.app",
    messagingSenderId: "1022537885699",
    appId: "1:1022537885699:web:d1ab1e85190ee93344c636"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, "playerA/rack"), (snapshot) => {
    const rack = snapshot.val() || "";
    document.getElementById("playerA").textContent =
        rack.split("").join(" ");
});

onValue(ref(db, "playerB/rack"), (snapshot) => {
    const rack = snapshot.val() || "";
    document.getElementById("playerB").textContent =
        rack.split("").join(" ");
});

</script>

</body>
</html>
