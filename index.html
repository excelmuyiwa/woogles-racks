<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Woogles Racks</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: black;
    color: white;
    text-align: center;
}

.player {
    margin: 40px;
}

.name {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 12px;
}

.rack {
    display: inline-flex;

    gap: 1px;

    background: #3a3a3a;

    padding: 6px;

    border-radius: 4px;
}

.tile {
    width: 42px;
    height: 48px;

    background: #d6d0d8;
    border: 1px solid #a8a0ab;

    border-radius: 3px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #222;
    font-size: 32px;
    font-weight: 500;

    box-sizing: border-box;
}

#topName,
#topScore,
#topClock,
#bottomName,
#bottomScore,
#bottomClock,
#bag,
#vowels,
#consonants {
    color: yellow;
    font-size: 28px;
    margin: 10px;
}
    
.point {
    position: absolute;

    right: 3px;
    bottom: 1px;

    font-size: 9px;
    font-weight: 600;

    color: #333;
}
#unseenTiles {
    width: 700px;

    margin: 20px auto;

    color: white;

    font-size: 22px;

    font-weight: bold;

    line-height: 1.5;

    text-align: left;

    white-space: pre-wrap;
}
    #unseenTilesBox {
    width: 750px;

    margin: 20px auto;

    background: #2f2f2f;

    border-radius: 8px;

    padding: 15px;
}

#unseenTitle {
    color: #f0f0f0;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 10px;

    text-align: center;

    letter-spacing: 2px;
}
    
</style>
</head>

<body>

<div id="topName"></div>
<div id="topScore"></div>
<div id="topClock"></div>

<div id="bottomName"></div>
<div id="bottomScore"></div>
<div id="bottomClock"></div>

<div id="bag"></div>
<div id="vowels"></div>
<div id="consonants"></div>
<div id="unseenTilesBox">
    <div id="unseenTitle">UNSEEN TILES</div>
    <div id="unseenTiles"></div>
</div>

<div class="player">
    <div class="name">Player A</div>
    <div id="playerA" class="rack"></div>
</div>

<div class="player">
    <div class="name">Player B</div>
    <div id="playerB" class="rack"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBnGbM2XT7ryHhfXqjJ2G5XyTJRpP0kYR0",
    authDomain: "woogles-racks.firebaseapp.com",
    databaseURL: "https://woogles-racks-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "woogles-racks",
    storageBucket: "woogles-racks.firebasestorage.app",
    messagingSenderId: "1022537885699",
    appId: "1:1022537885699:web:d1ab1e85190ee93344c636"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const values = {
    A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,
    I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,
    Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,
    Y:4,Z:10,"?":0
};

function renderRack(elementId, rack) {

    const container = document.getElementById(elementId);

    container.innerHTML = "";

    rack.split("").forEach(letter => {

        const tile = document.createElement("div");
        tile.className = "tile";

       tile.textContent = letter === "?" ? "" : letter;

        const point = document.createElement("span");
        point.className = "point";
        point.textContent = values[letter] ?? "";

        tile.appendChild(point);

        container.appendChild(tile);
    });
}

onValue(ref(db, "playerA/rack"), (snapshot) => {
    renderRack("playerA", snapshot.val() || "");
});

onValue(ref(db, "playerB/rack"), (snapshot) => {
    renderRack("playerB", snapshot.val() || "");
});

onValue(ref(db, "spectator"), (snapshot) => {

    const data = snapshot.val();

    if (!data) return;

document.getElementById("topName").textContent =
    data.topPlayer.name;

document.getElementById("topScore").textContent =
    data.topPlayer.score;

document.getElementById("topClock").textContent =
    data.topPlayer.clock;

document.getElementById("bottomName").textContent =
    data.bottomPlayer.name;

document.getElementById("bottomScore").textContent =
    data.bottomPlayer.score;

document.getElementById("bottomClock").textContent =
    data.bottomPlayer.clock;

document.getElementById("bag").textContent =
    `Bag: ${data.tilesInBag}`;

document.getElementById("vowels").textContent =
    `Vowels: ${data.vowels}`;

document.getElementById("consonants").textContent =
    `Consonants: ${data.consonants}`;
    
document.getElementById("unseenTiles").textContent =
    (data.unseenTiles || []).join("  ");

});

</script>

</body>
</html>
